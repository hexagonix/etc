#
# HBoot configuration file (boot.cfg)
#
# Read by HBoot itself, before Hexagon is loaded.
#
# $HexagonixOS$
#
# key=value pairs, one per line. Blank lines and lines starting with '#'
# are ignored.
#
# resolution=<width>x<height>x<bits per pixel>
#
resolution=800x600x32 # Changing the resolution here takes effect on the next boot.