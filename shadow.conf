# Hexagonix user database (username:password:code:shell:theme), one account
# per line.
#
# code: 0 = root user, every other user gets a unique code assigned
# by adduser, starting at 1.
# theme: dark or light.
#
# Warning! Never remove the root user! The system may stop working.

root:root:0:/bin/sh:dark
jack:jack:1:/bin/hash:dark
