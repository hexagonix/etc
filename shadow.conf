# Hexagonix user database (username:password:code:shell:theme), one account
# per line. Passwords here are plaintext, this file is never shipped as
# is; Scripts/configure.sh hashes each password when it builds /shadow onto
# the disk image (see the users()/djb2Hash() functions there).
#
# code: 777 = administrative user, 555 = common user.
# theme: dark or light.
#
# Warning! Never remove the root user! The system may stop working.

root:root:777:sh:dark
jack:jack:555:hash:dark
