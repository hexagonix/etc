\r\n# Hexagonix init script (rc)
\r\n#
\r\n# Do not change this file unless it is really necessary.
\r\n# The Unix 'login' tool is responsible for managing other features of the
\r\n# initialization, including controlling users and permissions.
\r\n#
\r\n# $HexagonixOS$
\r\n#
\r\n# key=value pairs, one per line. Blank lines and lines starting with '#'
\r\n# are ignored.
\r\n#
\r\n# start=<name>   - run <name> and wait for it to exit before continuing
\r\n# spawn=<name>   - run <name> in the background, do not track it afterward
\r\n# respawn=<name> - run <name> in the background and relaunch it if it ever
\r\n#                  exits, for as long as the system is running
\r\n#
\r\nspawn=clock
\r\nrespawn=login
